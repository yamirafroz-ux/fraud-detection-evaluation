[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxfraud"
version = "0.1.0"
description = "A physics-led stochastic laboratory for financial fraud under distribution shift"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.14,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
fluxfraud = "fluxfraud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
